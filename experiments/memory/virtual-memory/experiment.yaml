schema_version: 1
experiment:
  id: MEM-007
  name: anonymous-mapping
  module: memory.virtual
  description: "Map an anonymous region, write it, and read it back."
  risk: normal
  tags:
    - memory
platform:
  os: linux
  architectures:
    - x86_64
    - aarch64
build:
  target: exp_mem_007
  standard: c++20
  variants:
    - name: debug
      build_type: Debug
    - name: optimized
      build_type: Release
run:
  executable: exp_mem_007
  timeout_ms: 20000
  repetitions: 1
  arguments: []
observe:
    - stdout
    - stderr
    - exit_status
verify:
  checks:
    - name: exit
      type: exit_code
      expected: "0"
    - name: marker
      type: result_marker
      expected: pass
artifacts:
  preserve:
    - executable
    - build_log
    - run_log
knowledge:
  concepts:
    - mmap
  basis:
    - OS
