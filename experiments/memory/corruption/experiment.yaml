schema_version: 1
experiment:
  id: MEM-010
  name: allocator-checks
  module: memory.allocator
  description: "Reject a zero size and a repeated free."
  risk: normal
  tags:
    - memory
platform:
  os: linux
  architectures:
    - x86_64
    - aarch64
build:
  target: exp_mem_010
  standard: c++20
  variants:
    - name: debug
      build_type: Debug
    - name: optimized
      build_type: Release
run:
  executable: exp_mem_010
  timeout_ms: 20000
  repetitions: 1
  arguments: []
observe:
    - stdout
    - stderr
    - exit_status
verify:
  checks:
    - name: exit
      type: exit_code
      expected: "0"
    - name: marker
      type: result_marker
      expected: pass
artifacts:
  preserve:
    - executable
    - build_log
    - run_log
knowledge:
  concepts:
    - double-free
    - validation
  basis:
    - OBSERVED
