schema_version: 1
experiment:
  id: MEM-005
  name: size-class
  module: memory.allocator
  description: "Serve a small request from a class and a large request from a dedicated mapping."
  risk: normal
  tags:
    - memory
platform:
  os: linux
  architectures:
    - x86_64
    - aarch64
build:
  target: exp_mem_005
  standard: c++20
  variants:
    - name: debug
      build_type: Debug
    - name: optimized
      build_type: Release
run:
  executable: exp_mem_005
  timeout_ms: 20000
  repetitions: 1
  arguments: []
observe:
    - stdout
    - stderr
    - exit_status
verify:
  checks:
    - name: exit
      type: exit_code
      expected: "0"
    - name: marker
      type: result_marker
      expected: pass
artifacts:
  preserve:
    - executable
    - build_log
    - run_log
knowledge:
  concepts:
    - size-class
  basis:
    - OBSERVED
