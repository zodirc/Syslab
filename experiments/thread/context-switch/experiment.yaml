schema_version: 1
experiment:
  id: OS-007
  name: voluntary-switch-metric
  module: os.thread
  description: "Record voluntary context switches around sched_yield without a threshold."
  risk: normal
  tags:
    - os
platform:
  os: linux
  architectures:
    - x86_64
    - aarch64
build:
  target: exp_os_007
  standard: c++20
  variants:
    - name: debug
      build_type: Debug
    - name: optimized
      build_type: Release
run:
  executable: exp_os_007
  timeout_ms: 20000
  repetitions: 1
  arguments: []
observe:
    - performance_counter
    - stdout
    - stderr
    - exit_status
verify:
  checks:
    - name: exit
      type: exit_code
      expected: "0"
    - name: marker
      type: result_marker
      expected: pass
artifacts:
  preserve:
    - executable
    - build_log
    - run_log
knowledge:
  concepts:
    - context-switch
  basis:
    - OS
    - OBSERVED
