schema_version: 1
experiment:
  id: OS-003
  name: thread-id
  module: os.thread
  description: "Show that a new thread has a different tid."
  risk: normal
  tags:
    - os
platform:
  os: linux
  architectures:
    - x86_64
    - aarch64
build:
  target: exp_os_003
  standard: c++20
  variants:
    - name: debug
      build_type: Debug
    - name: optimized
      build_type: Release
run:
  executable: exp_os_003
  timeout_ms: 20000
  repetitions: 1
  arguments: []
observe:
    - syscall_trace
    - stdout
    - stderr
    - exit_status
verify:
  checks:
    - name: exit
      type: exit_code
      expected: "0"
    - name: marker
      type: result_marker
      expected: pass
artifacts:
  preserve:
    - executable
    - build_log
    - run_log
knowledge:
  concepts:
    - thread
    - tid
  basis:
    - OS
  prerequisites:
    - OS-001
