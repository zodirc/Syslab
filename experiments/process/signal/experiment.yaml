schema_version: 1
experiment:
  id: OS-009
  name: signal-delivery
  module: os.process
  description: "Handle one SIGUSR1 delivery."
  risk: normal
  tags:
    - os
platform:
  os: linux
  architectures:
    - x86_64
    - aarch64
build:
  target: exp_os_009
  standard: c++20
  variants:
    - name: debug
      build_type: Debug
    - name: optimized
      build_type: Release
run:
  executable: exp_os_009
  timeout_ms: 20000
  repetitions: 1
  arguments: []
observe:
    - syscall_trace
    - stdout
    - stderr
    - exit_status
verify:
  checks:
    - name: exit
      type: exit_code
      expected: "0"
    - name: marker
      type: result_marker
      expected: pass
artifacts:
  preserve:
    - executable
    - build_log
    - run_log
knowledge:
  concepts:
    - signal
  basis:
    - OS
