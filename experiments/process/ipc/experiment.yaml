schema_version: 1
experiment:
  id: OS-008
  name: pipe-and-shared-map
  module: os.ipc
  description: "Round-trip two bytes through a pipe and publish a word through MAP_SHARED."
  risk: normal
  tags:
    - os
platform:
  os: linux
  architectures:
    - x86_64
    - aarch64
build:
  target: exp_os_008
  standard: c++20
  variants:
    - name: debug
      build_type: Debug
    - name: optimized
      build_type: Release
run:
  executable: exp_os_008
  timeout_ms: 20000
  repetitions: 1
  arguments: []
observe:
    - stdout
    - stderr
    - exit_status
verify:
  checks:
    - name: exit
      type: exit_code
      expected: "0"
    - name: marker
      type: result_marker
      expected: pass
artifacts:
  preserve:
    - executable
    - build_log
    - run_log
knowledge:
  concepts:
    - pipe
    - shared-memory
  basis:
    - OS
