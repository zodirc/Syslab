schema_version: 1
experiment:
  id: SEC-002
  name: symlink-follow
  module: security.symlink
  description: "open follows a symlink to the target bytes and readlink returns the stored path."
  risk: normal
  tags:
    - security
platform:
  os: linux
  architectures:
    - x86_64
    - aarch64
build:
  target: exp_sec_002
  standard: c++20
  variants:
    - name: debug
      build_type: Debug
    - name: optimized
      build_type: Release
run:
  executable: exp_sec_002
  timeout_ms: 20000
  repetitions: 1
  arguments: []
observe:
    - stdout
    - stderr
    - exit_status
verify:
  checks:
    - name: exit
      type: exit_code
      expected: "0"
    - name: marker
      type: result_marker
      expected: pass
artifacts:
  preserve:
    - executable
    - build_log
    - run_log
knowledge:
  concepts:
    - symlink
  basis:
    - OS
  prerequisites:
    - SEC-001
