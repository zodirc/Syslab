schema_version: 1
experiment:
  id: AV-004
  name: planar-audio
  module: media.planar
  description: "Planar int16 stores the left plane before the right plane."
  risk: normal
  tags:
    - media
platform:
  os: linux
  architectures:
    - x86_64
    - aarch64
build:
  target: exp_av_004
  standard: c++20
  variants:
    - name: debug
      build_type: Debug
    - name: optimized
      build_type: Release
run:
  executable: exp_av_004
  timeout_ms: 20000
  repetitions: 1
  arguments: []
observe:
    - stdout
    - stderr
    - exit_status
verify:
  checks:
    - name: exit
      type: exit_code
      expected: "0"
    - name: marker
      type: result_marker
      expected: pass
artifacts:
  preserve:
    - executable
    - build_log
    - run_log
knowledge:
  concepts:
    - planar
  basis:
    - OS
  prerequisites:
    - AV-001
