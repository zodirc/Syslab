schema_version: 1
experiment:
  id: AV-002
  name: pixel-stride
  module: media.frame
  description: "Packed RGB24 addresses pixel x y at (y * width + x) * 3."
  risk: normal
  tags:
    - media
platform:
  os: linux
  architectures:
    - x86_64
    - aarch64
build:
  target: exp_av_002
  standard: c++20
  variants:
    - name: debug
      build_type: Debug
    - name: optimized
      build_type: Release
run:
  executable: exp_av_002
  timeout_ms: 20000
  repetitions: 1
  arguments: []
observe:
    - stdout
    - stderr
    - exit_status
verify:
  checks:
    - name: exit
      type: exit_code
      expected: "0"
    - name: marker
      type: result_marker
      expected: pass
artifacts:
  preserve:
    - executable
    - build_log
    - run_log
knowledge:
  concepts:
    - pixel
  basis:
    - OS
  prerequisites:
    - AV-001
