schema_version: 1
experiment:
  id: CACHE-001
  name: stride-checksum
  module: cache.locality
  description: "Checksum sequential and strided walks and record both durations."
  risk: resource_intensive
  tags:
    - cache
platform:
  os: linux
  architectures:
    - x86_64
    - aarch64
build:
  target: exp_cache_001
  standard: c++20
  variants:
    - name: debug
      build_type: Debug
    - name: optimized
      build_type: Release
run:
  executable: exp_cache_001
  timeout_ms: 60000
  repetitions: 1
  arguments: []
observe:
    - stdout
    - stderr
    - exit_status
verify:
  checks:
    - name: exit
      type: exit_code
      expected: "0"
    - name: marker
      type: result_marker
      expected: pass
artifacts:
  preserve:
    - executable
    - build_log
    - run_log
knowledge:
  concepts:
    - cache-line
    - stride
  basis:
    - LANG
    - MICROARCH
