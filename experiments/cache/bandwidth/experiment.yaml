schema_version: 1
experiment:
  id: CACHE-002
  name: copy-bandwidth
  module: cache.bandwidth
  description: "Copy a buffer and check the bytes."
  risk: resource_intensive
  tags:
    - cache
platform:
  os: linux
  architectures:
    - x86_64
    - aarch64
build:
  target: exp_cache_002
  standard: c++20
  variants:
    - name: debug
      build_type: Debug
    - name: optimized
      build_type: Release
run:
  executable: exp_cache_002
  timeout_ms: 20000
  repetitions: 1
  arguments: []
observe:
    - stdout
    - stderr
    - exit_status
verify:
  checks:
    - name: exit
      type: exit_code
      expected: "0"
    - name: marker
      type: result_marker
      expected: pass
artifacts:
  preserve:
    - executable
    - build_log
    - run_log
knowledge:
  concepts:
    - bandwidth
  basis:
    - OBSERVED
