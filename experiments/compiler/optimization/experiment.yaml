schema_version: 1
experiment:
  id: CPU-008
  name: constant-result
  module: compiler.optimization
  description: "Check a value that remains 6 after legal optimization."
  risk: normal
  tags:
    - compiler
platform:
  os: linux
  architectures:
    - x86_64
    - aarch64
build:
  target: exp_cpu_008
  standard: c++20
  variants:
    - name: debug
      build_type: Debug
    - name: optimized
      build_type: Release
run:
  executable: exp_cpu_008
  timeout_ms: 20000
  repetitions: 1
  arguments: []
observe:
    - disassembly
    - compiler_metadata
    - stdout
    - stderr
    - exit_status
verify:
  checks:
    - name: exit
      type: exit_code
      expected: "0"
    - name: marker
      type: result_marker
      expected: pass
artifacts:
  preserve:
    - executable
    - build_log
    - run_log
knowledge:
  concepts:
    - constant-folding
    - dead-code
  basis:
    - LANG
    - COMPILER
