schema_version: 1
experiment:
  id: RT-001
  name: object-layout
  module: runtime.layout
  description: "Print a standard-layout object and recognize a polymorphic type."
  risk: normal
  tags:
    - runtime
platform:
  os: linux
  architectures:
    - x86_64
    - aarch64
build:
  target: exp_rt_001
  standard: c++20
  variants:
    - name: debug
      build_type: Debug
    - name: optimized
      build_type: Release
run:
  executable: exp_rt_001
  timeout_ms: 20000
  repetitions: 1
  arguments: []
observe:
    - stdout
    - stderr
    - exit_status
verify:
  checks:
    - name: exit
      type: exit_code
      expected: "0"
    - name: marker
      type: result_marker
      expected: pass
artifacts:
  preserve:
    - executable
    - build_log
    - run_log
knowledge:
  concepts:
    - object-layout
    - rtti
  basis:
    - LANG
    - ABI
