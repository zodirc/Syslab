schema_version: 1
experiment:
  id: CPU-010
  name: branch-pattern
  module: cpu.microarch
  description: "Compare predictable and data-dependent branches by checksum, and record durations."
  risk: resource_intensive
  tags:
    - cpu
platform:
  os: linux
  architectures:
    - x86_64
    - aarch64
build:
  target: exp_cpu_010
  standard: c++20
  variants:
    - name: debug
      build_type: Debug
    - name: optimized
      build_type: Release
run:
  executable: exp_cpu_010
  timeout_ms: 60000
  repetitions: 1
  arguments: []
observe:
    - performance_counter
    - stdout
    - stderr
    - exit_status
perf_events:
    - cycles
verify:
  checks:
    - name: exit
      type: exit_code
      expected: "0"
    - name: marker
      type: result_marker
      expected: pass
artifacts:
  preserve:
    - executable
    - build_log
    - run_log
knowledge:
  concepts:
    - branch-prediction
  basis:
    - LANG
    - MICROARCH
    - OBSERVED
