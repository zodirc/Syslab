schema_version: 1
experiment:
  id: CPU-002
  name: call-and-return
  module: cpu.abi
  description: "Call a function and check the returned sum."
  risk: normal
  tags:
    - cpu
platform:
  os: linux
  architectures:
    - x86_64
    - aarch64
build:
  target: exp_cpu_002
  standard: c++20
  variants:
    - name: debug
      build_type: Debug
    - name: optimized
      build_type: Release
run:
  executable: exp_cpu_002
  timeout_ms: 20000
  repetitions: 1
  arguments: []
observe:
    - disassembly
    - stdout
    - stderr
    - exit_status
verify:
  checks:
    - name: exit
      type: exit_code
      expected: "0"
    - name: marker
      type: result_marker
      expected: pass
artifacts:
  preserve:
    - executable
    - build_log
    - run_log
knowledge:
  concepts:
    - calling-convention
    - return-value
  basis:
    - LANG
    - ABI
