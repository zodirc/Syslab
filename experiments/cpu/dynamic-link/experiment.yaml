schema_version: 1
experiment:
  id: CPU-007
  name: dynamic-link
  module: cpu.elf
  description: "Check that the executable has a PT_INTERP segment."
  risk: normal
  tags:
    - cpu
platform:
  os: linux
  architectures:
    - x86_64
    - aarch64
build:
  target: exp_cpu_007
  standard: c++20
  variants:
    - name: debug
      build_type: Debug
    - name: optimized
      build_type: Release
run:
  executable: exp_cpu_007
  timeout_ms: 20000
  repetitions: 1
  arguments: []
observe:
    - elf
    - disassembly
    - stdout
    - stderr
    - exit_status
verify:
  checks:
    - name: exit
      type: exit_code
      expected: "0"
    - name: marker
      type: result_marker
      expected: pass
artifacts:
  preserve:
    - executable
    - build_log
    - run_log
knowledge:
  concepts:
    - dynamic-linking
    - plt-got
  basis:
    - ABI
    - OS
