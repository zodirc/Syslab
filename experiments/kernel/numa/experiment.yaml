schema_version: 1
experiment:
  id: OS-010
  name: numa-nodes
  module: os.numa
  description: "Report unsupported when fewer than two NUMA nodes are visible."
  risk: normal
  tags:
    - os
platform:
  os: linux
  architectures:
    - x86_64
    - aarch64
build:
  target: exp_os_010
  standard: c++20
  variants:
    - name: debug
      build_type: Debug
    - name: optimized
      build_type: Release
run:
  executable: exp_os_010
  timeout_ms: 20000
  repetitions: 1
  arguments: []
observe:
    - stdout
    - stderr
    - exit_status
verify:
  checks:
    - name: exit
      type: exit_code
      expected: "0"
    - name: marker
      type: result_marker
      expected: pass
artifacts:
  preserve:
    - executable
    - build_log
    - run_log
knowledge:
  concepts:
    - numa
  basis:
    - OS
