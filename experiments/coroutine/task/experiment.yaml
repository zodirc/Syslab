schema_version: 1
experiment:
  id: CO-002
  name: coroutine-task
  module: runtime.coroutine
  description: "Interleave two tasks and propagate a coroutine exception."
  risk: normal
  tags:
    - runtime
platform:
  os: linux
  architectures:
    - x86_64
    - aarch64
build:
  target: exp_co_002
  standard: c++20
  variants:
    - name: debug
      build_type: Debug
    - name: optimized
      build_type: Release
run:
  executable: exp_co_002
  timeout_ms: 20000
  repetitions: 1
  arguments: []
observe:
    - stdout
    - stderr
    - exit_status
verify:
  checks:
    - name: exit
      type: exit_code
      expected: "0"
    - name: marker
      type: result_marker
      expected: pass
artifacts:
  preserve:
    - executable
    - build_log
    - run_log
knowledge:
  concepts:
    - coroutine
  basis:
    - LANG
