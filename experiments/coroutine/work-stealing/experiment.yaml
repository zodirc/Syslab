schema_version: 1
experiment:
  id: CO-003
  name: parallel-for
  module: runtime.scheduler
  description: "Sum a range with the work-stealing parallel_for."
  risk: normal
  tags:
    - runtime
platform:
  os: linux
  architectures:
    - x86_64
    - aarch64
build:
  target: exp_co_003
  standard: c++20
  variants:
    - name: debug
      build_type: Debug
    - name: optimized
      build_type: Release
run:
  executable: exp_co_003
  timeout_ms: 20000
  repetitions: 1
  arguments: []
observe:
    - stdout
    - stderr
    - exit_status
verify:
  checks:
    - name: exit
      type: exit_code
      expected: "0"
    - name: marker
      type: result_marker
      expected: pass
artifacts:
  preserve:
    - executable
    - build_log
    - run_log
knowledge:
  concepts:
    - work-stealing
  basis:
    - OBSERVED
