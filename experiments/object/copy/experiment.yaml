schema_version: 1
experiment:
  id: OBJ-001
  name: shallow-deep-copy
  module: object.copy
  description: "Compare a pointer copy with a copy of the pointed-to value."
  risk: normal
  tags:
    - object
platform:
  os: linux
  architectures:
    - x86_64
    - aarch64
build:
  target: exp_obj_001
  standard: c++20
  variants:
    - name: debug
      build_type: Debug
    - name: optimized
      build_type: Release
run:
  executable: exp_obj_001
  timeout_ms: 20000
  repetitions: 1
  arguments: []
observe:
    - stdout
    - stderr
    - exit_status
verify:
  checks:
    - name: exit
      type: exit_code
      expected: "0"
    - name: marker
      type: result_marker
      expected: pass
artifacts:
  preserve:
    - executable
    - build_log
    - run_log
knowledge:
  concepts:
    - shallow-copy
    - deep-copy
  basis:
    - LANG
