schema_version: 1
experiment:
  id: CTR-001
  name: pid-namespace
  module: container.pid
  description: "Map the caller to uid 0, then check that the first CLONE_NEWPID child is pid 1."
  risk: normal
  tags:
    - container
platform:
  os: linux
  architectures:
    - x86_64
    - aarch64
build:
  target: exp_ctr_001
  standard: c++20
  variants:
    - name: debug
      build_type: Debug
    - name: optimized
      build_type: Release
run:
  executable: exp_ctr_001
  timeout_ms: 20000
  repetitions: 1
  arguments: []
observe:
    - stdout
    - stderr
    - exit_status
verify:
  checks:
    - name: exit
      type: exit_code
      expected: "0"
    - name: marker
      type: result_marker
      expected: pass
artifacts:
  preserve:
    - executable
    - build_log
    - run_log
knowledge:
  concepts:
    - pid-namespace
  basis:
    - OS
  prerequisites:
    - OS-003
