schema_version: 1
experiment:
  id: CTR-006
  name: net-namespace
  module: container.net
  description: "Index lo in a new net namespace and fail to index the previous foreign interface."
  risk: normal
  tags:
    - container
platform:
  os: linux
  architectures:
    - x86_64
    - aarch64
build:
  target: exp_ctr_006
  standard: c++20
  variants:
    - name: debug
      build_type: Debug
    - name: optimized
      build_type: Release
run:
  executable: exp_ctr_006
  timeout_ms: 20000
  repetitions: 1
  arguments: []
observe:
    - stdout
    - stderr
    - exit_status
verify:
  checks:
    - name: exit
      type: exit_code
      expected: "0"
    - name: marker
      type: result_marker
      expected: pass
artifacts:
  preserve:
    - executable
    - build_log
    - run_log
knowledge:
  concepts:
    - netns
  basis:
    - OS
  prerequisites:
    - CTR-001
