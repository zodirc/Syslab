schema_version: 1
experiment:
  id: CTR-004
  name: address-limit
  module: container.address
  description: "Admit a mapping inside the RLIMIT_AS headroom and reject a larger one."
  risk: normal
  tags:
    - container
platform:
  os: linux
  architectures:
    - x86_64
    - aarch64
build:
  target: exp_ctr_004
  standard: c++20
  variants:
    - name: debug
      build_type: Debug
    - name: optimized
      build_type: Release
run:
  executable: exp_ctr_004
  timeout_ms: 20000
  repetitions: 1
  arguments: []
observe:
    - stdout
    - stderr
    - exit_status
verify:
  checks:
    - name: exit
      type: exit_code
      expected: "0"
    - name: marker
      type: result_marker
      expected: pass
artifacts:
  preserve:
    - executable
    - build_log
    - run_log
knowledge:
  concepts:
    - rlimit-as
  basis:
    - OS
  prerequisites:
    - MEM-007
