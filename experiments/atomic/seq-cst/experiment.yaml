schema_version: 1
experiment:
  id: AT-005
  name: seq-cst-iriw
  module: atomic.memory-order
  description: "Fail if a seq_cst IRIW sample observes the forbidden outcome."
  risk: normal
  tags:
    - atomic
platform:
  os: linux
  architectures:
    - x86_64
    - aarch64
build:
  target: exp_at_005
  standard: c++20
  variants:
    - name: debug
      build_type: Debug
    - name: optimized
      build_type: Release
run:
  executable: exp_at_005
  timeout_ms: 20000
  repetitions: 1
  arguments: []
observe:
    - stdout
    - stderr
    - exit_status
verify:
  checks:
    - name: exit
      type: exit_code
      expected: "0"
    - name: marker
      type: result_marker
      expected: pass
artifacts:
  preserve:
    - executable
    - build_log
    - run_log
knowledge:
  concepts:
    - seq-cst
    - iriw
  basis:
    - LANG
    - OBSERVED
