schema_version: 1
experiment:
  id: AT-001
  name: synchronized-counter
  module: atomic.race
  description: "Increment a counter with a mutex. The unsynchronized race is not executed."
  risk: normal
  tags:
    - atomic
platform:
  os: linux
  architectures:
    - x86_64
    - aarch64
build:
  target: exp_at_001
  standard: c++20
  variants:
    - name: debug
      build_type: Debug
    - name: optimized
      build_type: Release
run:
  executable: exp_at_001
  timeout_ms: 20000
  repetitions: 1
  arguments: []
observe:
    - stdout
    - stderr
    - exit_status
verify:
  checks:
    - name: exit
      type: exit_code
      expected: "0"
    - name: marker
      type: result_marker
      expected: pass
artifacts:
  preserve:
    - executable
    - build_log
    - run_log
knowledge:
  concepts:
    - data-race
  basis:
    - LANG
  prerequisites:
    - SYNC-004
