schema_version: 1
experiment:
  id: AT-004
  name: seq-cst-store-buffering
  module: atomic.memory-order
  description: "Sequentially consistent stores must not both observe zero."
  risk: normal
  tags:
    - atomic
platform:
  os: linux
  architectures:
    - x86_64
    - aarch64
build:
  target: exp_at_004
  standard: c++20
  variants:
    - name: debug
      build_type: Debug
    - name: optimized
      build_type: Release
run:
  executable: exp_at_004
  timeout_ms: 20000
  repetitions: 1
  arguments: []
observe:
    - stdout
    - stderr
    - exit_status
verify:
  checks:
    - name: exit
      type: exit_code
      expected: "0"
    - name: marker
      type: result_marker
      expected: pass
artifacts:
  preserve:
    - executable
    - build_log
    - run_log
knowledge:
  concepts:
    - seq-cst
    - store-buffering
  basis:
    - LANG
