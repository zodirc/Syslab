schema_version: 1
experiment:
  id: STO-004
  name: lock-order
  module: storage.lock-order
  description: "Commit two updates in one lock order and abandon the opposite order at timeout."
  risk: normal
  tags:
    - storage
platform:
  os: linux
  architectures:
    - x86_64
    - aarch64
build:
  target: exp_sto_004
  standard: c++20
  variants:
    - name: debug
      build_type: Debug
    - name: optimized
      build_type: Release
run:
  executable: exp_sto_004
  timeout_ms: 20000
  repetitions: 1
  arguments: []
observe:
    - stdout
    - stderr
    - exit_status
verify:
  checks:
    - name: exit
      type: exit_code
      expected: "0"
    - name: marker
      type: result_marker
      expected: pass
artifacts:
  preserve:
    - executable
    - build_log
    - run_log
knowledge:
  concepts:
    - lock-order
  basis:
    - OS
  prerequisites:
    - SYNC-004
