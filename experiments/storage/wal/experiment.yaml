schema_version: 1
experiment:
  id: STO-005
  name: wal-replay
  module: storage.wal
  description: "Replay a WAL record newer than the page LSN, and skip it after the log is truncated."
  risk: normal
  tags:
    - storage
platform:
  os: linux
  architectures:
    - x86_64
    - aarch64
build:
  target: exp_sto_005
  standard: c++20
  variants:
    - name: debug
      build_type: Debug
    - name: optimized
      build_type: Release
run:
  executable: exp_sto_005
  timeout_ms: 20000
  repetitions: 1
  arguments: []
observe:
    - stdout
    - stderr
    - exit_status
verify:
  checks:
    - name: exit
      type: exit_code
      expected: "0"
    - name: marker
      type: result_marker
      expected: pass
artifacts:
  preserve:
    - executable
    - build_log
    - run_log
knowledge:
  concepts:
    - wal
  basis:
    - OS
  prerequisites:
    - STO-002
