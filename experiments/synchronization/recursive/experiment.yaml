schema_version: 1
experiment:
  id: SYNC-006
  name: recursive-mutex
  module: synchronization.lock
  description: "The owning thread locks twice, then several threads exclude each other."
  risk: normal
  tags:
    - synchronization
platform:
  os: linux
  architectures:
    - x86_64
    - aarch64
build:
  target: exp_sync_006
  standard: c++20
  variants:
    - name: debug
      build_type: Debug
    - name: optimized
      build_type: Release
run:
  executable: exp_sync_006
  timeout_ms: 20000
  repetitions: 1
  arguments: []
observe:
    - stdout
    - stderr
    - exit_status
verify:
  checks:
    - name: exit
      type: exit_code
      expected: "0"
    - name: marker
      type: result_marker
      expected: pass
artifacts:
  preserve:
    - executable
    - build_log
    - run_log
knowledge:
  concepts:
    - recursive-mutex
  basis:
    - OBSERVED
