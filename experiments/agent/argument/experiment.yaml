schema_version: 1
experiment:
  id: AG-004
  name: argument-range
  module: agent.argument
  description: "Reject arguments outside 0..10 before calling the tool."
  risk: normal
  tags:
    - agent
platform:
  os: linux
  architectures:
    - x86_64
    - aarch64
build:
  target: exp_ag_004
  standard: c++20
  variants:
    - name: debug
      build_type: Debug
    - name: optimized
      build_type: Release
run:
  executable: exp_ag_004
  timeout_ms: 20000
  repetitions: 1
  arguments: []
observe:
    - stdout
    - stderr
    - exit_status
verify:
  checks:
    - name: exit
      type: exit_code
      expected: "0"
    - name: marker
      type: result_marker
      expected: pass
artifacts:
  preserve:
    - executable
    - build_log
    - run_log
knowledge:
  concepts:
    - argument
  basis:
    - LANG
  prerequisites:
    - AG-001
