schema_version: 1
experiment:
  id: AG-001
  name: tool-dispatch
  module: agent.tool
  description: "Run a tool only when its name is in the table."
  risk: normal
  tags:
    - agent
platform:
  os: linux
  architectures:
    - x86_64
    - aarch64
build:
  target: exp_ag_001
  standard: c++20
  variants:
    - name: debug
      build_type: Debug
    - name: optimized
      build_type: Release
run:
  executable: exp_ag_001
  timeout_ms: 20000
  repetitions: 1
  arguments: []
observe:
    - stdout
    - stderr
    - exit_status
verify:
  checks:
    - name: exit
      type: exit_code
      expected: "0"
    - name: marker
      type: result_marker
      expected: pass
artifacts:
  preserve:
    - executable
    - build_log
    - run_log
knowledge:
  concepts:
    - dispatch
  basis:
    - LANG
